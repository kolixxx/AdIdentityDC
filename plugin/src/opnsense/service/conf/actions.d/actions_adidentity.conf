[start]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --reproject
parameters:
type:script
message:AdIdentity restore alias tables from stored sessions

[stop]
command:/bin/true
parameters:
type:script
message:AdIdentity stop (noop)

[restart]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --reproject
parameters:
type:script
message:AdIdentity restart (restore alias tables)

[reproject]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --reproject
parameters:
type:script_output
message:AdIdentity reproject alias tables

[status]
command:/usr/bin/true
parameters:
type:script_output
message:AdIdentity status

[reload]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --reproject
parameters:
type:script
message:AdIdentity reload (restore alias tables)

[session-list]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --list
parameters:
type:script_output
message:AdIdentity list local sessions

[session-upsert]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --upsert --payload-b64
parameters:%s
type:script_output
message:AdIdentity upsert session

[session-remove]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --remove --payload-b64
parameters:%s
type:script_output
message:AdIdentity remove session

[session-replace]
command:/usr/local/opnsense/scripts/adidentity/session_store.py --replace-all --payload-b64
parameters:%s
type:script_output
message:AdIdentity replace all sessions (resync)
