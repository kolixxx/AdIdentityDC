{# Generated from OPNsense AdIdentity model #}
{% if helpers.exists('OPNsense.adidentity.general') %}
enabled={{ OPNsense.adidentity.general.enabled }}
agent_base_url={{ OPNsense.adidentity.general.agent_base_url }}
enable_user_aliases={{ OPNsense.adidentity.general.enable_user_aliases }}
user_alias_prefix={{ OPNsense.adidentity.general.user_alias_prefix }}
auto_create_aliases={{ OPNsense.adidentity.general.auto_create_aliases }}
session_ttl_sec={{ OPNsense.adidentity.general.session_ttl_sec }}
debounce_ms={{ OPNsense.adidentity.general.debounce_ms }}
{# Keep monitored groups as comma-separated for the Python store #}
monitored_groups={{ OPNsense.adidentity.general.monitored_groups | replace("\r", "") | replace("\n", ",") }}
{% endif %}
